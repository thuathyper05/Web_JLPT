services:
  - type: web
    name: hyper-jlpt-webapp
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: KEEP_ALIVE_URL
        sync: false
